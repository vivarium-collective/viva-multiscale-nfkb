# The environment the composite is verified in: the same core and the same pinned
# entries as the compose-api mash-up that will run it in production
# (compose-api compose_api/registry/environments.yaml `composition`, and
# manifest.yaml pins). Kept apart from the workspace's dashboard env, whose
# process-bigraph floats with vivarium-workbench. Bump a pin here only when
# compose-api's manifest moves it.
[project]
name = "multiscale-nfkb-compose"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
    "process-bigraph==1.9.1",
    "bigraph-schema==1.8.1",
    "tellurium==2.2.13.1",
    # v0.2.3 (846f87c, viva-tellurium#37: the parameters_in port), as compose-api's manifest pins it since #502 / 0.7.79.
    "viva-tellurium @ git+https://github.com/vivarium-collective/viva-tellurium@846f87c57058a6bfa383619c9ae7587f0d81453c",
    # v0.1.2 (a57c21a, viva-maboss#1: the carried joint state is drawn in a canonical order, so a seed reproduces
    # across platforms), as compose-api's manifest pins it.
    "viva-maboss @ git+https://github.com/vivarium-collective/viva-maboss@a57c21a1c7ca8f5aa27252d3d4c696d70153019f",
    "viva-basic-processes @ git+https://github.com/vivarium-collective/viva-basic-processes@f9ea4bd35f1ab94e4a8e9e715eaf78da0d04fcc4",
    # 25e8a05 (viva-pde-particle#70: RegionMean and RegionTotal), as compose-api's manifest pins it since 0.7.90.
    "viva-pde-particle @ git+https://github.com/vivarium-collective/viva-pde-particle@25e8a058f01cf2f107e6504899baa11d13fff0de",
]

[tool.uv]
package = false
