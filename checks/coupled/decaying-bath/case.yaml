description: 'The dose study''s decaying bath (decision 50) in its own document (s2-dose dose_study.document, intact, 30 min
  per unit, bath-near-M10: c0 0.000114657 uM, lambda 0.00211062 /s, 270 fate networks). Every cell''s TNF node starts off
  (decision 49; the first and last cells are checked). At each coupling instant t = 30 k s, Lipniacki''s TNF_R and the TNF
  rates in the shared parameters store (u = occ, d = 1 - occ) equal the closed form occ = c0 exp(-lambda t) / (c0 exp(-lambda
  t) + Kd), Kd 1.9e-05 uM, from the seeded value at t = 0 to t = 1200 s (occupancy 0.858 to 0.324). Generated by checks/coupled/make_decaying_bath.py.'
