description: 'MaBoSSProcess on Calzone 2010''s full cell-fate network (31 nodes, the reference configuration: TNF off, TransRate
  1/24), one interval of 10 in 100 windows, 100000 trajectories. Every node''s probability over the last window [9.9, 10]
  is compared with MaBoSS''s own reference output for that configuration (sysbio-curie/MaBoSS@375ffad engine/tests/maboss/cellfate/refer/res_probtraj.csv,
  summed over joint states). The only node that moves is mROS, whose reference value 0.339405 also matches its analytic window
  average 0.339384. Tolerance 0.008, about 3.5 combined standard errors. Generated by checks/boolean/make_calzone_reference.py.'
document: document.pbg
interval: 10.0
scale_level: molecule
