[project]
name = "multiscale-nfkb"
version = "0.0.0"
description = "Process-bigraph research workspace"
requires-python = ">=3.12"
# Runtime dependencies are only what the workspace package imports to run its
# processes, so `pip install <workspace>` stays lean: a backend that installs the
# package into its own environment (an HPC runner, compose-api, sms-api's
# extra_pip_deps) gets no dashboard stack. The dashboard is the `dashboard` extra
# below; the container image and `.[dev]` install it. A process module that
# imports anything else (numpy, matplotlib, ...) must list it here: `build_core()`
# skips a module that fails to import, so a backend without it would silently
# lose that module's processes.
dependencies = [
    # Floor: 1.8.5 ships the composite `core_extensions` mechanism (1.8.0) the
    # dashboard relies on AND the emitter fix (#217) + `requests`/`fire` server
    # deps. Below this, composite type-registration and agent-embedded emits
    # break — the root cause behind the map[...] type errors seen in the field.
    "process-bigraph>=1.8.5",
    "bigraph-schema>=1.8.1",
    # The `cli` subpackage reads composite documents with it.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Web-based workspace dashboard (server + templates + assets + lib helpers),
# reports and visualizations. vivarium-workbench was extracted from viva-template
# as of v0.4.16 and provides the `vivarium-workbench serve` CLI invoked by
# scripts/serve.sh and the container image (Dockerfile, Singularity.def).
dashboard = [
    "bigraph-viz>=2.0.3",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    "vivarium-workbench",
]
# The statistics the studies' verdicts use (E4: s2-dose/e4_verdict.py).
analysis = ["scipy", "statsmodels>=0.14"]
# Local development and workspace CI (`uv pip install -e ".[dev]"`) run the lint,
# the reports, the dashboard and the tests (E4's among them), so they need both.
dev = ["pytest>=7.4", "multiscale-nfkb[dashboard,analysis]"]
cli = ["typer", "rich"]
# The simulators the composites address, at the commits compose-api's registry pins (as compose/pyproject.toml has
# them), so the dashboard can build a composite and export it to compose-api: the export imports each
# `local:<module>.<Class>`. Not in `dashboard`, because the image installs that and builds for linux/arm64, where
# libRoadRunner has no wheel. Install with `uv sync --extra simulators`.
simulators = [
    "viva-tellurium @ git+https://github.com/vivarium-collective/viva-tellurium@846f87c57058a6bfa383619c9ae7587f0d81453c",
    "viva-maboss @ git+https://github.com/vivarium-collective/viva-maboss@a57c21a1c7ca8f5aa27252d3d4c696d70153019f",
    "viva-basic-processes @ git+https://github.com/vivarium-collective/viva-basic-processes@f9ea4bd35f1ab94e4a8e9e715eaf78da0d04fcc4",
    "viva-pde-particle @ git+https://github.com/vivarium-collective/viva-pde-particle@25e8a058f01cf2f107e6504899baa11d13fff0de",
]

[project.scripts]
multiscale-nfkb = "viva_multiscale_nfkb.cli.__main__:main"

# The container image (Dockerfile, Singularity.def) runs `uv sync`, which installs
# no extras but does install uv's default dependency groups; this group carries the
# dashboard extra into the image, so `vivarium-workbench serve` is always there,
# and `analysis` the statistics into the workspace environment (`uv run`).
# Groups are not package metadata, so `pip install <workspace>` is unaffected.
[dependency-groups]
analysis = ["multiscale-nfkb[analysis]"]
docs = [
    "myst-parser>=4",
    "pydata-sphinx-theme>=0.16",
    "sphinx>=8",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
]
workbench = ["multiscale-nfkb[dashboard]"]

[tool.uv]
default-groups = ["workbench", "analysis"]
# vivarium-workbench asks for viva-basic-processes from git `main`; every request takes the commit compose-api's
# registry pins (as the simulators extra and compose/ do), so the dashboard and the runs use the same TimeSeriesStep.
override-dependencies = [
    "viva-basic-processes @ git+https://github.com/vivarium-collective/viva-basic-processes@f9ea4bd35f1ab94e4a8e9e715eaf78da0d04fcc4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Allow ecosystem git-direct-reference deps (viva-superpowers / vivarium-workbench
# @ git+https://…) that workspaces commonly add — hatchling rejects them otherwise.
[tool.hatch.metadata]
allow-direct-references = true

# Declare the workspace Python package explicitly so this workspace is
# pip-installable (e.g. `pip install git+<repo>@<sha>`).  sms-api injects it
# as an extra_pip_dep so the container runner can import the workspace's
# processes from a committed + pushed git ref.
[tool.hatch.build.targets.wheel]
packages = ["viva_multiscale_nfkb"]

[tool.uv.sources]
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }
