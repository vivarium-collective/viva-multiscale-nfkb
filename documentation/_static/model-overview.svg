<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 346" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">The three scales of the model</title>
  <desc id="d">TNF diffuses from a source through the medium to a cell. Receptors on the cell turn the TNF that reaches them into a signal. Inside the cell the signal drives NF-kB into the nucleus in damped waves. The cell-fate network weighs NF-kB against the death signals and settles on survival, apoptosis or necrosis.</desc>
  <defs>
    <radialGradient id="tnf" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2f6fb0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2f6fb0" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="344" rx="12" fill="#fbfbfa" stroke="#d6d9dd"/>

  <!-- 1. Medium -->
  <g transform="translate(24,24)">
    <text x="0" y="16" font-size="15" font-weight="600" fill="#1f2937">1. TNF spreads</text>
    <text x="0" y="36" font-size="12.5" fill="#4b5563">through the medium around the cell</text>
    <rect x="0" y="52" width="200" height="180" rx="8" fill="#ffffff" stroke="#d6d9dd"/>
    <circle cx="62" cy="142" r="70" fill="url(#tnf)"/>
    <circle cx="62" cy="142" r="6" fill="#2f6fb0"/>
    <text x="62" y="166" font-size="11" fill="#2f6fb0" text-anchor="middle">source</text>
    <circle cx="160" cy="142" r="22" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <circle cx="160" cy="142" r="8" fill="#e5e7eb" stroke="#374151"/>
    <text x="160" y="184" font-size="11" fill="#374151" text-anchor="middle">cell</text>
    <text x="0" y="256" font-size="11.5" fill="#6b7280">2-D diffusion, D = 100 µm²/s</text>
    <text x="0" y="274" font-size="11.5" fill="#6b7280">viva-pde-particle</text>
  </g>
  <line x1="236" y1="166" x2="262" y2="166" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Receptors -->
  <g transform="translate(272,24)">
    <text x="0" y="16" font-size="15" font-weight="600" fill="#1f2937">2. Receptors bind it</text>
    <text x="0" y="36" font-size="12.5" fill="#4b5563">the signal the cell feels</text>
    <rect x="0" y="52" width="180" height="180" rx="8" fill="#ffffff" stroke="#d6d9dd"/>
    <path d="M30 210 A80 80 0 0 1 150 210" fill="none" stroke="#374151" stroke-width="2"/>
    <g stroke="#9d3c8e" stroke-width="2.5" stroke-linecap="round">
      <line x1="52" y1="178" x2="44" y2="160"/><line x1="90" y1="162" x2="90" y2="142"/><line x1="128" y1="178" x2="136" y2="160"/>
    </g>
    <g fill="#2f6fb0"><circle cx="42" cy="154" r="4.5"/><circle cx="90" cy="136" r="4.5"/><circle cx="114" cy="112" r="4.5"/><circle cx="60" cy="104" r="4.5"/></g>
    <text x="90" y="86" font-size="13" fill="#1f2937" text-anchor="middle">bound = c / (c + K<tspan font-size="10" dy="3">d</tspan><tspan dy="-3">)</tspan></text>
    <text x="0" y="256" font-size="11.5" fill="#6b7280">TNFR1, K<tspan font-size="9" dy="2">d</tspan><tspan dy="-2"> = 19 pM (Grell 1998)</tspan></text>
    <text x="0" y="274" font-size="11.5" fill="#6b7280">a small translation step</text>
  </g>
  <line x1="468" y1="166" x2="494" y2="166" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Signalling -->
  <g transform="translate(504,24)">
    <text x="0" y="16" font-size="15" font-weight="600" fill="#1f2937">3. NF-κB responds</text>
    <text x="0" y="36" font-size="12.5" fill="#4b5563">in damped waves in the nucleus</text>
    <rect x="0" y="52" width="200" height="180" rx="8" fill="#ffffff" stroke="#d6d9dd"/>
    <text x="14" y="78" font-size="11" fill="#6b7280">nuclear NF-κB</text>
    <line x1="14" y1="206" x2="186" y2="206" stroke="#d6d9dd"/>
    <line x1="14" y1="90" x2="14" y2="206" stroke="#d6d9dd"/>
    <path d="M14 204 C 28 204, 34 104, 50 104 S 70 186, 84 180 S 102 134, 114 136 S 132 170, 144 168 S 160 150, 170 152 S 182 160, 186 159" fill="none" stroke="#b7791f" stroke-width="2.5"/>
    <text x="186" y="222" font-size="11" fill="#6b7280" text-anchor="end">time</text>
    <text x="0" y="256" font-size="11.5" fill="#6b7280">Lipniacki 2004 ODE model</text>
    <text x="0" y="274" font-size="11.5" fill="#6b7280">Tellurium (libRoadRunner)</text>
  </g>
  <line x1="720" y1="166" x2="746" y2="166" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. Fate -->
  <g transform="translate(756,24)">
    <text x="0" y="16" font-size="15" font-weight="600" fill="#1f2937">4. The cell decides</text>
    <text x="0" y="36" font-size="12.5" fill="#4b5563">NF-κB against the death signals</text>
    <rect x="0" y="52" width="180" height="180" rx="8" fill="#ffffff" stroke="#d6d9dd"/>
    <rect x="20" y="72" width="140" height="38" rx="19" fill="#e2efe8"/><text x="90" y="96" font-size="13" font-weight="600" fill="#2f7a5b" text-anchor="middle">survival</text>
    <rect x="20" y="124" width="140" height="38" rx="19" fill="#f5e1df"/><text x="90" y="148" font-size="13" font-weight="600" fill="#b4443c" text-anchor="middle">apoptosis</text>
    <rect x="20" y="176" width="140" height="38" rx="19" fill="#ece8f3"/><text x="90" y="200" font-size="13" font-weight="600" fill="#5b4a8a" text-anchor="middle">necrosis</text>
    <text x="0" y="256" font-size="11.5" fill="#6b7280">Calzone 2010 cell-fate network</text>
    <text x="0" y="274" font-size="11.5" fill="#6b7280">MaBoSS (Boolean, stochastic)</text>
  </g>

  <text x="480" y="326" font-size="12" fill="#6b7280" text-anchor="middle">Each scale runs in its own simulator; process-bigraph joins them into one model, which runs on a laptop or on compose-api.</text>
</svg>
