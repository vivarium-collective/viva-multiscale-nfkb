# s1-survival-validation/study.yaml — schema v4. Study 1 of tnf-fate-in-space (decision 29, Alex, 2026-11-06).
# It adds no mechanism: every condition changes a parameter the published models already have (house rule 2).

schema_version: 4
name: s1-survival-validation
investigation: tnf-fate-in-space
title: Survival under TNF (validation against NF-kB-dependent survival)
created: '2026-11-06'
status: ran
phase: Evaluate
parent_studies:
- {study: s0-coupling-calibration, condition: ran, relation: leads-to}

question: >
  Under held, saturating TNF, can the composite let most cells with working NF-kB survive, while cells without NF-kB
  still die, using only the published models' own parameters? If not, where is the limit?

hypothesis: >
  Calzone's network is a race between a fast death route and slow NF-kB-induced protection (science/calzone-network).
  With the protective genes induced fast enough relative to the death route, survival should rise. Whether it can
  become a majority under held TNF is unknown: the network's own example rates give 1.4%, and the Calzone 2010 paper
  reports about 30% from a rate-free analysis.

objective: >
  Phase A: run Calzone's network alone, NF-kB intact and knocked out, (a) with the protective genes' induction speed
  swept far past MaBoSS's example, and (b) at the composite's own settings for each death clock, as the like-for-like
  comparator. Phase B: run the composite at six death clocks, NF-kB intact and knocked out, on Study 0's 200 seeds, and
  measure how many cells NF-kB itself saves.

assumptions:
- text: >
    Calzone's network is the coupled network with u_NFkB = 1, d_NFkB = 0, k_time = 1 (checks/boolean/coupled-equals-full),
    so r_tx plays TransRate. At a death clock of m minutes per unit the composite is Calzone's network with TransRate
    r_tx * 60 m read after 24 * 60 / m units, because the genes run at r_tx per second and every other rate, including
    NF-kB's activation route (TNFR, RIP1, RIP1ub, IKK), runs on k_time; only the final NFkB node runs at f * kappa.
- text: >
    The standard (most NF-kB-competent cells survive TNF alone; NF-kB loss sensitises) comes from Micheau & Tschopp
    2003 and Lee et al. 2016, proposed by the agent and accepted by Alex on 2026-11-06 (investigation inputs.references).

conditions:
  # Two arms, both NF-kB intact, TNF held on, absorbing death (decision 28).
  baseline:
  - name: composite
    description: "Phase B: the kinetic-Boolean composite (phase_b.py)."
    composite: viva_multiscale_nfkb.composites.kinetic_boolean
    params:
      interval: 30.0
      sample_count: 1
  - name: calzone-alone
    description: "Phase A: Calzone's network alone in MaBoSSProcess, 20,000 trajectories (phase_a.py)."
    process: viva_maboss.processes.MaBoSSProcess
  variants:
  - name: nfkb-knockout
    description: "NF-kB knocked out: Calzone alone u_NFkB = 0, d_NFkB = 1; composite kappa = 0 (the NF-kB node never switches on)."
  - name: transrate-ceiling
    description: "Phase A ceiling: TransRate 1/24, 1/4, 1, 4, 16, 64 per unit, read at t = 40 units, 20,000 trajectories."
  - name: death-clocks
    description: "Phase A matched and Phase B: death clocks 30, 120, 180, 200, 240, 480 min per unit; 24 h."
  model_settings:
  - name: phase-b-cells
    gate: optional
    description: "Phase B: 200 cells on Study 0's seeds 1-200, coupling every 30 s, kappa = ln 2/337 s when intact."

controls:
  negative: "NF-kB knocked out: no cell can show Survival (its rule is NFkB); cells die, or stay undecided at slow clocks."
  positive: "Calzone alone at MaBoSS's example rates reproduces the coupled-equals-full oracle (Survival on 0.014)."

readouts:
- "Alive: no death node (Apoptosis, NonACD) ever on; with absorbing death, none on at the end."
- "No fate: no fate node ever on in 24 h (undecided)."
- "Net protection: cells alive with NF-kB intact but dead without it, minus the reverse, paired by seed (exact McNemar p)."
- "Survival on at 24 h (a snapshot), and on throughout the last 2 h."

alternative_hypotheses:
- hypothesis: "The coupling (the flickering NF-kB node, the r_tx anchor) weakens NF-kB's protection in the composite."
  status: partly supported
  how_tested: >
    Against the matched comparator, the composite's protection is lower at fast and middle clocks (30: 0 vs 12.5
    points; 120: 10.5 vs 21.5) and equal at slow ones (240: 9.0 vs 8.8; 480: -0.5 vs 0.3).
- hypothesis: "The limit is Calzone's own race, upstream of the genes."
  status: supported
  how_tested: >
    The knockouts match the comparator within about 2 standard errors at every clock, and the composite never protects
    significantly more than Calzone alone. The
    ceiling saturates as induction speeds up (f1), and NF-kB's activation route runs on the death clock in both.

falsifiability: >
  Protection in the composite clearly above Calzone alone at matched settings would contradict f4. A clock with most
  NF-kB-competent cells surviving (Survival held, not merely undecided) and most knocked-out cells dead would meet the
  standard.

limitations: >
  The standard is qualitative, from the two accepted sources; reading "survive" as Survival held through the last 2 h
  (not merely undecided) was fixed after Phase B. The 24 h horizon is only
  3 to 12 Calzone units at 120-480 min per unit, so at slow clocks many cells are undecided and protection is still
  changing. The p values are not corrected for the six comparisons. The pairing by seed is partial (trajectories share
  random numbers only until they diverge), so the paired p values overstate the separation somewhat. Only rates are
  varied; the network's structure is not.

claim: >
  Under held, saturating TNF the composite does not meet the standard, read as held survival, at any death clock: NF-kB's net protection is at
  most about 10-13 points at 24 h, and where most intact cells are alive (200 min per unit and slower) it is because
  many have not yet reached any fate. The limit is Calzone's own race between caspase-8 and NF-kB's activation route,
  both on the death clock; the coupling lowers protection further only at fast and middle clocks.
confidence: Investigating

findings:
- id: f1-calzone-survival-ceiling
  tier: observation
  summary: >
    Calzone's network alone, held TNF, t = 40 units, absorbing death, 20,000 trajectories. Alive with NF-kB intact rises
    with induction speed and saturates: 0.017, 0.078, 0.156, 0.217, 0.242 and 0.252 at TransRate 1/24, 1/4, 1, 4, 16 and
    64. Knocked out, no cell is alive at any rate. Survival on is higher (0.014 to 0.319) because in Calzone's network a
    cell can show Survival and a death node together.
  evidence: data/phase_a.json (ceiling); phase_a.py
- id: f2-why-the-ceiling
  tier: interpretation
  mechanism_origin: emergent
  summary: >
    NF-kB's activation route (TNFR -> RIP1 -> RIP1ub -> IKK -> NFkB, four steps) races caspase-8's (TNFR + FADD -> DISC ->
    CASP8, two steps), and active caspase-8 cleaves RIP1, closing NF-kB's route. Fast induction cannot help a cell whose
    NF-kB never switches on. In the composite the same race runs on the death clock, because TNFR, RIP1, RIP1ub and IKK
    switch at k_time (cellfate_coupled.bnd). Read from the rules and the saturation in f1; not tested by varying the
    upstream rates.
  evidence: f1; datasets/calzone2010_cellfate/processed/cellfate_coupled.bnd
- id: f3-composite-protection
  tier: observation
  summary: >
    The composite, held TNF from rest, 24 h, 200 cells, at 30, 120, 180, 200, 240 and 480 min per unit. Alive intact
    against knocked out: 0 and 0; 0.160 and 0.055; 0.465 and 0.340; 0.550 and 0.455; 0.740 and 0.650; 0.980 and 0.985.
    Rescued against lost by NF-kB: 0/0, 22/1 (p = 6e-6), 36/11 (p = 3e-4), 29/10 (p = 0.003), 26/8 (p = 0.003), 1/2: a
    net protection of 0, 10.5, 12.5, 9.5, 9.0 and -0.5%. Cells with no fate at all, intact and knocked out: 0/0, 6/11,
    43/68, 54/91, 82/130, 163/197. Survival on throughout the last 2 h: 0, 6, 11, 18, 24, 18 cells.
  evidence: data/phase_b.json; parquet-runs/{intact,knocked_out}-*/timeseries.parquet; phase_b.py
- id: f4-composite-against-calzone
  tier: interpretation
  mechanism_origin: emergent
  summary: >
    Calzone's network alone at the composite's own settings protects 12.5, 21.5, 17.1, 14.2, 8.8 and 0.3 points at the
    same six clocks, and its knockouts match the composite's at every clock (0.059 vs 0.055 at 120; 0.339 vs 0.340 at
    180; 0.621 vs 0.650 at 240). So the death comes from Calzone's own race (f2), not from the coupling. The coupling
    lowers protection further at fast and middle clocks (30: 0 against 12.5; 120: 10.5 against 21.5) but not at slow
    ones. At 200 min per unit most intact cells are alive and most knocked-out cells dead (0.550 against 0.455), which
    meets the standard only through delay: 54 of 110 alive intact cells reached no fate and 18 held Survival through
    the last 2 h. No tested clock gives held survival to most NF-kB-competent cells.
  evidence: f1; f3; data/phase_a.json (matched)

followup_study_proposals:
- title: Anchor NF-kB's activation route to Lipniacki
  motivation: >
    In the composite, NF-kB's activation route (TNFR, RIP1, RIP1ub, IKK) runs on the death clock, although Lipniacki's
    model already times the same activation (nuclear NF-kB's half-rise 337 s). Putting that route on Lipniacki's clock,
    as r_tx does for the genes, would let NF-kB activate before caspase-8 at slow death clocks without adding a
    mechanism. A decision for Alex; to be tested as a Study 1 variant before any model change.

runs:
- name: phase-a-calzone-alone
  status: complete
  emitter:
    kind: json
    store: data/phase_a.json
  params: "{\"cells\": 20000, \"windows\": 40, \"seed\": 11, \"absorb_death\": 1, \"ceiling_transrate\": [\"1/24\", \"1/4\", \"1\", \"4\", \"16\", \"64\"], \"ceiling_units\": 40, \"matched_minutes_per_unit\": [30, 120, 180, 200, 240, 480], \"engine\": \"cmaboss (compose/, pinned)\"}"
- name: phase-b-composite-clocks
  status: complete
  emitter:
    kind: parquet
    store: parquet-runs/
  params: "{\"cells\": 200, \"hours\": 24, \"seed\": 1, \"absorb_death\": 1, \"kappa\": {\"intact\": \"ln2/337\", \"knocked_out\": 0}, \"minutes_per_unit\": [30, 120, 180, 200, 240, 480], \"builder\": \"../s0-coupling-calibration/population.py\", \"environment\": \"compose/ (pinned to compose-api's production mash-up; process-bigraph 1.9.1)\"}"
