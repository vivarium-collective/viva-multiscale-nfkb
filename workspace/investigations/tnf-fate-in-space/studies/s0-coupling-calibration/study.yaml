# s0-coupling-calibration/study.yaml — schema v4
#
# Study 0 of tnf-fate-in-space: calibrate the two clocks the composite cannot take from either model alone, before the
# headline studies (1-3) run on it. Runs execute in the workspace's pinned compose/ environment through compose-api's
# own runner (Alex, 2026-11-04: "Pinned env; workbench records"); run_grid.py registers each grid point in runs.db and
# writes its population time series to parquet-runs/<run_id>/.

schema_version: 4
name: s0-coupling-calibration
investigation: tnf-fate-in-space
title: Coupling calibration (NF-kB switching speed and the death clock)
created: '2026-11-04'
status: planned
phase: Evaluate

objective: >
  Simulate Lipniacki's NF-kB kinetics coupled to Calzone's cell-fate network under TNF, across the Boolean NF-kB node's
  switching speed kappa and the death-machinery clock k_time, and measure the fraction of cells reaching each fate
  after 24 h (each cell counted once, by the first fate it reaches), to decide which kappa the composite uses and whether the plausible death clocks leave room for TNF's dose
  and timing to change fate.

question: >
  How fast must the Boolean NF-kB node follow Lipniacki's nuclear NF-kB (kappa), and how fast is the death machinery
  (k_time), for the composite's survival / apoptosis / necrosis split under TNF to depend on NF-kB at all?

hypothesis: >
  With Calzone's own flicker (kappa = k_time, about once per Calzone unit) the protective genes cannot accumulate and
  survival stays near zero whatever NF-kB does (tutorial 02, measured with held f). Anchoring kappa to Lipniacki's own
  NF-kB timescale lets the node stay on through NF-kB's first wave, so survival should rise with slower death clocks.
  This is a prediction from the held-f probes, not yet a measurement with the real kinetic layer.

assumptions:
- text: >
    Each run's kinetic layer is deterministic and shared by all cells; each cell's fate network is an independent
    stochastic cell (MaBoSSProcess, sample_count 1, its own seed), carrying one sampled joint state between
    intervals (viva-maboss F1). Population fractions are fractions of cells.
- text: >
    Transcription-scale steps switch on at r_tx = ln2/2107 s from Lipniacki (anchor_transcription.py); their
    switch-off rates remain on k_time.

runtime:
  default_emitter: parquet

baseline:
- name: kinetic-boolean
  composite: viva_multiscale_nfkb.composites.kinetic_boolean
  params:
    interval: 30.0
    sample_count: 1

# The grid (run_grid.py builds and runs every point; each is one run in runs.db):
#   kappa:  calzone-flicker (= k_time), lipniacki-nfkb (ln2 / 337 s, NF-kB's own nuclear half-rise),
#           lipniacki-gene (ln2 / 2107 s, the NF-kB -> target-protein delay; a slow bracket)
#   k_time: one Calzone unit per 2, 10, 30 or 120 min
#   cells:  200 per point (seeds base..base+199); 24 h of composite time (Alex, 2026-11-04: "24 hours everywhere";
#           at 8 h, 77-85% of cells were still undecided at 120 min/unit); coupling interval 30 s
simulation_set:
- name: calibration-grid
  kind: sweep
  composite: kinetic-boolean
  axes:
    kappa: [calzone-flicker, lipniacki-nfkb, lipniacki-gene]
    minutes_per_calzone_unit: [2, 10, 30, 120]
  seeds: 200
  metrics: [survival_fraction, apoptosis_fraction, nonacd_fraction, undecided_fraction, nfkb_first_peak_time]
- name: kinetic-boolean-baseline
  kind: single
  base_model: viva_multiscale_nfkb.composites.kinetic_boolean.kinetic-boolean
  is_baseline: true
  status: ran
  params:
    interval: 30.0
    sample_count: 1
  metrics:
  - first-fate fractions at 24 h
  - NF-kB trajectory

robustness:
  replicates: 200            # cells per grid point; Wilson 95% intervals reported per fraction
  parameter_sweep: true

controls:
- name: nfkb-knockout
  kind: negative
  description: >
    kappa > 0 with the kinetic stimulus off (TNF_R 0) would leave f at rest (~0.0077); not yet run. The positive
    anchor for the fate network itself is checks/boolean/coupled-equals-full and coupled-nfkb-knockout (verified).

# The composite emits node_state (per cell) and nfkb_fraction. The workbench's check-observables cannot build it,
# because the simulators live only in the pinned compose/ env (Alex's environment split), so these readouts are
# verified there instead: the recorded smoke runs emit both (parquet-runs/smoke-*/timeseries.parquet).
readouts:
- name: first-fate fractions at 24 h
  observable: node_state.Survival, node_state.Apoptosis, node_state.NonACD
  aggregate: >-
    each cell's fate code (Survival + 2*Apoptosis + 4*NonACD) per tick; each cell is counted once, by the first fate
    it reaches (a tie when two switch on in one coupling step), and the end state is reported separately, because
    Calzone's fate nodes are not mutually exclusive
- name: NF-kB trajectory
  observable: nfkb_fraction

canonical_runs:
- name: decay
  label: >-
    Study 0b (Alex, 2026-11-06: "Anchor protein decay"): the same grid with the transcription-scale products (cFLIP,
    BCL2, mROS, mcIAP, mXIAP, Survival) switching OFF at Lipniacki's protein turnover (A20's c5 = 3e-4/s, half-life
    38.5 min; anchor_turnover.py) instead of Calzone's unit rate x k_time
  script: workspace/investigations/tnf-fate-in-space/studies/s0-coupling-calibration/run_grid.py
  args: [--decay]
- name: grid
  default: true
  label: full calibration grid (3 kappa x 4 k_time x 200 cells, 24 h)
  script: workspace/investigations/tnf-fate-in-space/studies/s0-coupling-calibration/run_grid.py
  args: []
- name: smoke
  label: smoke (2 kappa x 1 k_time x 10 cells, 1 h)
  script: workspace/investigations/tnf-fate-in-space/studies/s0-coupling-calibration/run_grid.py
  args: [--smoke]

limitations:
- One cell type, one TNF stimulus (TNF_R stepped to 1 and held); no spatial layer yet (that is Studies 1-3).
- Fate is read over 24 h; cells with no fate by then are reported as undecided, not assigned.
- A first grid (8 h) summed the fate nodes as if they were exclusive. They are not (a cell can show caspase-3 and ATP loss together), so its fractions double-counted and were VOID; it was superseded by this 24 h, first-fate grid.
- The death clock k_time has no measured anchor; the grid brackets it.

falsifiability: >
  If survival stays near zero for every kappa and k_time in the grid, NF-kB cannot protect in this composite at any
  plausible clock, and the headline studies have nothing to find; that would send the design back to the coupling,
  not forward.

# Evaluate (2026-11-06; corrected the same day after an adversarial review). Every number is from data/fate-table.json
# (end state at 24 h), data/paired.json (cell by cell against the grid, same seeds, exact McNemar p),
# data/{grid,decay}-summary.json and checks/boolean/coupled-equals-full/case.yaml.
claim: >
  Under TNF held on at saturation, the coupled composite kills nearly every cell at every NF-kB switching speed and
  death clock tried (durable survival 0-6% at 24 h). Calzone's own network also kills nearly every cell at the
  comparable transcription speed (survival 1.4%), but the coupling shifts that death toward necrosis and removes the
  1.4%. Slowing the death clock shifts death from apoptosis to necrosis instead of rescuing cells. Study 0b's decay
  test was confounded (f3); the persistence bound (Study 0c) replaces it.
confidence: Investigating

findings:
- id: f1-near-total-death
  tier: observation
  summary: >
    Durable survival (Survival on, no death node, at 24 h) is 0 at 2, 10 and 30 min per Calzone unit for every kappa,
    and 1.5-6% at 120 min (grid). Every cell is dead by 24 h at 2-30 min/unit. At 120 min/unit 77-89% are dead and
    10-18% show no fate node, because 24 h is only 12 Calzone units there, short of the 40 at which Calzone's own run
    is read.
  evidence: data/fate-table.json (grid-*)
- id: f2-near-calzone-not-equal
  tier: observation
  summary: >
    Near-total death is also Calzone's own answer, but the split is not the same. The unmodified network on the MaBoSS
    engine (TNF on, cellfate.cfg TransRate 1/24) gives Survival 0.014, Apoptosis 0.953 and NonACD 0.029 at t = 40. At
    2 min/unit (effective TransRate r_tx/k_time = 0.039, about 1/25; 24 h is far past t = 40 there) the composite gives
    survival 0 in 600 cells (8 expected at 0.014), apoptosis 0.915-0.95 and necrosis 0.05-0.085. The difference is
    the coupling. Calzone's NFkB switches on at rate 1 per unit while its gate is open and stays on. The coupled node
    switches on at f*kappa and off at (1-f)*kappa even with the gate open (about 9 min to switch on at f = 0.9 and
    kappa = ln2/337 s, against 2 min for Calzone's at this clock).
  evidence: checks/boolean/coupled-equals-full/case.yaml; data/fate-table.json (grid-*-2min)
- id: f3-decay-confounded
  tier: observation
  summary: >
    Study 0b is confounded, so it does not test protective-protein persistence. decay-lipniacki also slowed the
    switch-off of mROS (on when NF-kB is OFF; it licenses ROS, a necrosis driver) and of Survival (the readout node).
    Cell by cell against the grid, both artefacts show:
    - at 2 and 10 min/unit, all six pairs shift toward necrosis: 9 of 9 changed cells at 2 min/unit for both
      calzone-flicker and lipniacki-nfkb (p = 0.004 each); 15 against 3 at calzone-flicker 10 min/unit (p = 0.008);
    - at 120 min/unit, where Lipniacki's turnover is 2.2x FASTER than Calzone's switch-off, durable survival at
      lipniacki-nfkb fell from 12 to 2 cells (p = 0.006).
    The p values are uncorrected. None passes a Bonferroni threshold over the 48 tests (12 pairs x 4 readouts) on its
    own, but the direction is the same in every fast-clock pair, and the mechanism (mROS) is in the edit.
  evidence: data/paired.json (decay-*); population.py EDITS["decay-lipniacki"]
- id: f4-clock-sets-mode
  tier: observation
  summary: >
    The death clock sets the death mode. At kappa = lipniacki-nfkb, end-state apoptosis falls from 0.935 (2 min/unit)
    through 0.79 and 0.69 to 0.455 (120 min/unit), while necrosis rises from 0.065 through 0.21 and 0.31 to 0.355.
    The first fate arrives after about 5-9 Calzone units at every clock (medians 18, 74-76, 205-213 and 658-766 min).
    The median counts only cells with a fate by 24 h, so at 120 min/unit it is biased low.
  evidence: data/fate-table.json; data/{grid,decay}-summary.json (first_fate_time_s_median)
- id: f5-kappa-small
  tier: observation
  summary: >
    kappa does not change durable survival at 2-30 min/unit (0 for every kappa). It moves the apoptosis/necrosis split
    by up to 0.135 (apoptosis at 30 min/unit). At 120 min/unit, lipniacki-nfkb gives the most cells that show
    Survival first (0.425; calzone-flicker 0.19), but most of them die later (0.25 of the 0.425). Decision (Alex,
    2026-11-06): the composite uses kappa = lipniacki-nfkb (ln2/337 s), the speed measured in Lipniacki's own model,
    which keeps NF-kB's speed independent of the assumed death clock.
  evidence: data/fate-table.json (end_*, first_survival, first_survival_then_dead)
- id: f6-two-regimes
  tier: interpretation
  mechanism_origin: emergent
  summary: >
    Two regimes, depending on the clock; both are hypotheses that Study 0c tests.
    - Fast clocks (2-10 min/unit). Cells die (medians 18-76 min) before the protective products can be made: they
      switch on at r_tx, a 35-min half-rise, while NF-kB is still in its first wave (f peaks at 0.933 at 24 min). The
      limit would be how fast they are made, not how fast they decay.
    - Slow clocks (120 min/unit). NF-kB falls to f = 0.020 at 80 min and settles at f = 0.28 after about 6 h. The
      coupled node is then on about 28% of the time, so the protective products' logic keeps failing, while the death
      arms run without pause under TNF. Of the cells that show Survival first, 57-100% (across all runs) die later.
  evidence: parquet-runs/grid-lipniacki-nfkb-120min/timeseries.parquet (nfkb_fraction); data/fate-table.json
- id: f7-knockouts
  tier: observation
  summary: >
    Removing caspase-8's cleavage of RIP1 turns every death into necrosis (cell by cell, 158 and 138 apoptotic cells
    all became necrotic). Removing both gates (that cleavage and SMAC's sequestration of cIAP) keeps 45 and 54 of 200
    cells alive at 24 h (10 and 30 min/unit; p < 0.001), but durable survival rises only to 5 and 10 cells (2.5-5%).
    The gates delay and divert death; they are not the main barrier to survival.
  evidence: data/paired.json (ko-*)

alternative_hypotheses:
- hypothesis: The coupling, not Calzone's network, causes the near-total death.
  status: partly excluded
  how_excluded: >
    The uncoupled network also kills about 98% (f2), and the coupling's equivalence checks (checks/boolean/
    coupled-equals-full, -equals-full-early, -equals-full-seconds, -equals-full-early-seconds, coupled-nfkb-knockout)
    hold with u_NFkB = 1, d_NFkB = 0. But the coupling does shift the split toward necrosis and remove Calzone's 1.4%
    survival (f2).
- hypothesis: Protective products decay too fast to bridge NF-kB's troughs.
  status: open
  how_excluded: >
    Study 0b was confounded (f3). The persistence bound (Study 0c: cFLIP, BCL2, mXIAP and mcIAP never switch off) tests
    it directly.

discovery_implications:
  resolved:
  - Survival under held, saturating TNF is near zero in this composite; Calzone's own network gives 1.4%.
  - The death clock decides apoptosis against necrosis, and the first fate arrives after about 5-9 Calzone units.
  - kappa = lipniacki-nfkb (Alex, 2026-11-06).
  remaining:
  - Whether protein persistence could rescue survival at all (Study 0c, running).
  - Whether TNF's dose and timing (exposure, pulse length) change fate, which a held saturating stimulus cannot show.
  - The death clock still has no measured anchor.
  followup_study_proposals:
  - title: Persistence bound (Study 0c)
    motivation: >
      Decides whether protein persistence is a lever at all. If never-decaying protective products still give no
      durable survival, the protection race cannot be won under held TNF, and the headline studies should be about
      exposure. If they do, a corrected decay test (protective products only) places Lipniacki's turnover on that
      scale.
  - title: Graded transcription
    motivation: >
      Lipniacki's transcription is proportional to nuclear NF-kB. Calzone's genes see only an on/off node. Driving the
      protective products' switch-on rate by f directly would be a coupling change, for Alex to decide after 0c.
  - title: Exposure (dose and pulse length)
    motivation: >
      With held, saturating TNF, fate is almost fixed, so dose and timing can only act through whether and when each
      cell's TNF input switches on, and for how long (u_TNF/d_TNF; McMillan 2021 dose-response, d1).

