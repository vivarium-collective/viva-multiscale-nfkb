<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" stroke-linejoin="round" stroke-linecap="round">
  <defs>
    <clipPath id="frame">
      <rect x="20" y="20" width="472" height="472" rx="60"/>
    </clipPath>
  </defs>

  <!-- Rocko-style sunny backdrop -->
  <rect x="20" y="20" width="472" height="472" rx="60" fill="#7fd1ea"/>
  <g clip-path="url(#frame)">
    <circle cx="410" cy="110" r="56" fill="#ffd23f" stroke="#1d1d1d" stroke-width="10"/>
    <path d="M10 380 Q110 318 220 368 T520 340 L520 520 L10 520 Z" fill="#7ccf8e" stroke="#1d1d1d" stroke-width="10"/>
    <path d="M10 430 Q150 390 270 430 T520 415 L520 520 L10 520 Z" fill="#f49cb3" stroke="#1d1d1d" stroke-width="10"/>
  </g>
  <rect x="20" y="20" width="472" height="472" rx="60" fill="none" stroke="#1d1d1d" stroke-width="14"/>

  <!-- Eyelid: a 12-cycle graph (C12) drawn as the almond outline -->
  <polygon fill="#fff6dc" points="60,256 110,200 180,150 256,128 332,150 402,200 452,256 402,312 332,362 256,384 180,362 110,312"/>

  <!-- Iris: 8 rim nodes forming a cycle, joined to a hub (wheel graph W8) -->
  <polygon fill="#ff8c42" points="351,256 323,323 256,351 189,323 161,256 189,189 256,161 323,189"/>

  <!-- Eyelid edges (the C12 cycle) -->
  <polygon fill="none" stroke="#1d1d1d" stroke-width="11" points="60,256 110,200 180,150 256,128 332,150 402,200 452,256 402,312 332,362 256,384 180,362 110,312"/>

  <!-- Rim cycle and spokes of the iris wheel -->
  <polygon fill="none" stroke="#1d1d1d" stroke-width="6" points="351,256 323,323 256,351 189,323 161,256 189,189 256,161 323,189"/>
  <g stroke="#1d1d1d" stroke-width="6">
    <line x1="256" y1="256" x2="351" y2="256"/>
    <line x1="256" y1="256" x2="323" y2="323"/>
    <line x1="256" y1="256" x2="256" y2="351"/>
    <line x1="256" y1="256" x2="189" y2="323"/>
    <line x1="256" y1="256" x2="161" y2="256"/>
    <line x1="256" y1="256" x2="189" y2="189"/>
    <line x1="256" y1="256" x2="256" y2="161"/>
    <line x1="256" y1="256" x2="323" y2="189"/>
  </g>

  <!-- Eyelid nodes -->
  <g stroke="#1d1d1d" stroke-width="6" fill="#fff6dc">
    <circle cx="110" cy="200" r="11"/>
    <circle cx="180" cy="150" r="11"/>
    <circle cx="256" cy="128" r="11"/>
    <circle cx="332" cy="150" r="11"/>
    <circle cx="402" cy="200" r="11"/>
    <circle cx="402" cy="312" r="11"/>
    <circle cx="332" cy="362" r="11"/>
    <circle cx="256" cy="384" r="11"/>
    <circle cx="180" cy="362" r="11"/>
    <circle cx="110" cy="312" r="11"/>
  </g>
  <circle cx="60" cy="256" r="14" fill="#ff6f91" stroke="#1d1d1d" stroke-width="6"/>
  <circle cx="452" cy="256" r="14" fill="#ff6f91" stroke="#1d1d1d" stroke-width="6"/>

  <!-- Iris rim nodes -->
  <g stroke="#1d1d1d" stroke-width="6" fill="#ffd23f">
    <circle cx="351" cy="256" r="13"/>
    <circle cx="323" cy="323" r="13"/>
    <circle cx="256" cy="351" r="13"/>
    <circle cx="189" cy="323" r="13"/>
    <circle cx="161" cy="256" r="13"/>
    <circle cx="189" cy="189" r="13"/>
    <circle cx="256" cy="161" r="13"/>
    <circle cx="323" cy="189" r="13"/>
  </g>

  <!-- Pupil hub -->
  <circle cx="256" cy="256" r="24" fill="#1d1d1d"/>
  <ellipse cx="248" cy="246" rx="7" ry="5" fill="#fff6dc" transform="rotate(-20 248 246)"/>
</svg>